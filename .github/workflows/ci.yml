name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,api,ui]"
      - run: python scripts/publication_guard.py --commit HEAD
      - run: ruff check src tests
      - run: pytest -q

  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python scripts/publication_guard.py --commit HEAD
      - run: python -m pip install -e ".[api,ui,browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/capture_demo_media.py --output artifacts/browser-qa
      - uses: actions/upload-artifact@v7
        with:
          name: skillpulse-browser-qa-${{ github.sha }}
          path: artifacts/browser-qa/
          if-no-files-found: error
          retention-days: 14
