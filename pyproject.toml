[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillpulse-ai"
version = "0.1.0"
description = "Reproducible job-intelligence pipeline for Indonesian data and analytics roles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.139,<1.0",
  "openpyxl>=3.1,<4.0",
  "pandas>=2.0,<3.0",
  "pydantic>=2.9,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.10,<3.0",
  "pytest>=8.0,<10.0",
  "ruff>=0.8,<1.0",
]
semantic = [
  "sentence-transformers>=5.6,<6.0",
]
api = [
  "uvicorn>=0.51,<1.0",
]
ui = [
  "streamlit>=1.60,<2.0",
]

[project.scripts]
skillpulse-prepare = "skillpulse.data.pipeline:main"
skillpulse-verify-source = "skillpulse.data.provenance:main"
skillpulse-extract = "skillpulse.extraction.cli:main"
skillpulse-evaluate = "skillpulse.extraction.evaluation:main"
skillpulse-match = "skillpulse.matching.cli:main"
skillpulse-relevance = "skillpulse.matching.relevance:main"
skillpulse-ai-challenger = "skillpulse.extraction.ai_challenger:main"
skillpulse-contract = "skillpulse.domain.contracts:main"
skillpulse-api = "skillpulse.api.app:main"
skillpulse-ui = "skillpulse.ui.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
